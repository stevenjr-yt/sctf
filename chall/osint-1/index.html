<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Challenge</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #map { height: 500px; width: 100%; border-radius: 0.5rem; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-4xl w-full bg-gray-800 p-6 rounded-lg shadow-lg">
        <h1 class="text-3xl font-bold mb-2 text-center text-blue-400">Geolocation Challenge</h1>
        <p class="text-gray-300 text-center mb-6">Temukan lokasi pasti dari gambar target. Klik pada peta untuk menebak titiknya!</p>
        
        <div id="map" class="mb-4 border-2 border-gray-700 shadow-inner"></div>

        <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="text-sm text-gray-400 font-mono">
                Koordinat tebakan: <span id="coord-display" class="text-yellow-400">Belum ada titik dipilih</span>
            </div>
            <button id="submit-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-6 rounded transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                Submit Tebakan
            </button>
        </div>

        <div id="result-message" class="mt-4 text-center font-bold text-lg hidden p-3 rounded"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inisialisasi map view ke seluruh dunia
        const map = L.map('map').setView([0, 0], 2);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let currentMarker = null;
        let selectedLat = null;
        let selectedLng = null;

        const coordDisplay = document.getElementById('coord-display');
        const submitBtn = document.getElementById('submit-btn');
        const resultMessage = document.getElementById('result-message');

        // Event saat map diklik
        map.on('click', function(e) {
            selectedLat = e.latlng.lat;
            selectedLng = e.latlng.lng;

            if (currentMarker) {
                map.removeLayer(currentMarker);
            }
            currentMarker = L.marker([selectedLat, selectedLng]).addTo(map);
            
            coordDisplay.textContent = `${selectedLat.toFixed(6)}, ${selectedLng.toFixed(6)}`;
            submitBtn.disabled = false;
        });

        // Event saat tombol submit diklik
        submitBtn.addEventListener('click', async () => {
            if (!selectedLat || !selectedLng) return;

            submitBtn.disabled = true;
            submitBtn.textContent = "Mengecek...";
            resultMessage.classList.add('hidden');

            try {
                const response = await fetch('verify.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        lat: selectedLat,
                        lng: selectedLng
                    })
                });

                const data = await response.json();

                resultMessage.classList.remove('hidden');
                if (data.success) {
                    resultMessage.className = "mt-4 text-center font-bold text-lg p-3 rounded bg-green-900/50 text-green-400 border border-green-500";
                    resultMessage.innerHTML = `🔥 Tepat Sasaran! Ini flag kamu: <br><span class="font-mono text-xl text-white">${data.flag}</span>`;
                } else {
                    resultMessage.className = "mt-4 text-center font-bold text-lg p-3 rounded bg-red-900/50 text-red-400 border border-red-500";
                    resultMessage.innerHTML = `❌ ${data.message} (Jarak error: ${data.distance} meter)`;
                }
            } catch (error) {
                console.error('Error:', error);
                alert("Terjadi kesalahan pada server.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Submit Tebakan";
            }
        });
    </script>
</body>
</html>
